# Forge's own compaction: the session `e2e/summarized` is made with
# compact mode builtin, takes one turn, and a `compact` step has it summarize
# itself.
uses: [Forge]
procedures:
  main:
    access: public
    returns: Bool
    failing: anything
    result:
      call:
        procedure: invoke
        arguments:
          model: claude
          session: e2e/summarized
          compact_mode: { case: builtin }
          body:
            closure:
              returns: Bool
              body:
                - let: said
                  value: { call: { procedure: agent, arguments: { prompt: work } } }
              result: { call: { procedure: compact } }
